name: CI

# GolmetSite — gates de qualidade (RN-017): build SSG + metas + Lighthouse >= 90 mobile.
# Falha em qualquer gate bloqueia o merge (branch protection na main — SECURITY §2).
# A validação strict dos .md (RN-008) entra como etapa própria quando o pipeline
# de conteúdo existir (feature RN-007 — RN-007-1).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (SSG production)
        run: npm run build
      - name: Metas check (RN-017 — bloqueia o merge em falha)
        run: npm run check:metas
      - name: Unit tests
        run: npm test -- --watch=false
      - name: Lighthouse (mobile — RN-017)
        run: npx -y @lhci/cli@0.14.x autorun
