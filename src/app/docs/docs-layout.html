<div class="gm-docs">
  <aside class="gm-docs-sidebar">
    <app-docs-search />
    @for (group of state().toc; track group.group) {
      <details class="gm-toc-group" [open]="state().openGroups.has(group.group)">
        <summary class="gm-toc-group-name">{{ group.group }}</summary>
        <ul class="gm-toc">
          @for (item of group.items; track item.slug) {
            <li>
              <a
                [routerLink]="'/docs/' + item.slug"
                routerLinkActive="active"
                >{{ item.title }}</a
              >
            </li>
          }
        </ul>
      </details>
    }
  </aside>
  <main class="gm-docs-content">
    <router-outlet />
  </main>
  <aside class="gm-docs-toc" aria-label="Nesta página">
    <p class="gm-docs-toc-title">{{ state().copy.onThisPage }}</p>
    @if (pageToc(); as items) {
      <ul class="gm-docs-toc-list">
        @for (item of items; track item.id) {
          <li [class.is-h3]="item.level === 3">
            <button
              type="button"
              class="gm-docs-toc-link"
              (click)="scrollToAnchor(item.id)"
            >
              {{ item.text }}
            </button>
          </li>
        }
      </ul>
    } @else {
      <p class="gm-docs-toc-empty">…</p>
    }
  </aside>
</div>
