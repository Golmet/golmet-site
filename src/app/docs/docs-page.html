<article class="gm-doc-page">
  @if (html) {
    @if (!translated) {
      <div class="gm-not-translated" role="status">{{ copy.notTranslated }}</div>
    }
    <div class="gm-doc-content" [innerHTML]="html"></div>
  } @else {
    <h2>Page not found</h2>
    <p>The guardian only asserts what it cites — this documentation page does not exist.</p>
    <p>Use the sidebar or the search.</p>
  }
</article>
