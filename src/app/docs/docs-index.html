<h2>{{ copy.sidebarTitle }}</h2>
<p class="gm-docs-index-note">{{ copy.indexNote }}</p>
@if (toc.length > 0) {
  <ul class="gm-docs-index-list">
    @for (group of toc; track group.group) {
      @for (item of group.items; track item.slug) {
        <li>
          <a [routerLink]="['/docs', item.slug]">{{ item.title }}</a>
        </li>
      }
    }
  </ul>
}
