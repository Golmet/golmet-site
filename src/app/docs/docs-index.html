@if (state().pages.length > 0) {
  <h2>{{ state().copy.sidebarTitle }}</h2>
  <p class="gm-docs-index-note">{{ state().copy.indexNote }}</p>
  <ul class="gm-docs-index-list">
    @for (item of state().pages; track item.slug) {
      <li>
        <a [routerLink]="'/docs/' + item.slug">{{ item.title }}</a>
      </li>
    }
  </ul>
}
