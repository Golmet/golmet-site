<div class="gm-docs-search">
  <input
    class="gm-docs-search-input"
    type="search"
    [value]="query()"
    (input)="onInput($any($event.target).value)"
    placeholder="Buscar na documentação…"
    aria-label="Buscar na documentação"
  />
  @if (results().length > 0) {
    <ul class="gm-docs-search-results">
      @for (result of results(); track result.slug) {
        <li>
          <a [routerLink]="['/docs', result.slug]">{{ result.title }}</a>
        </li>
      }
    </ul>
  }
</div>
